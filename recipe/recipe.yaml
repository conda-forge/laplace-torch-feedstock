context:
  name: laplace-torch
  version: "0.2.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: c0dc635e4cdd597d149677f51cfc5d91799fbf8251c0714025c675e9d9633451

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
    - setuptools-scm
    - pdm
    - pdm-backend
  run:
    - asdfghjkl
    - backpack-for-pytorch
    - curvlinops-for-pytorch
    - python >=${{ python_min }}
    - pytorch
    - torchvision
    - torchmetrics
    - numpy
    - tqdm
    - opt_einsum
    - asdfghjkl ==0.1a4
    - torchaudio

tests:
  - python:
      imports:
        - laplace
        - laplace.curvature
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: laplace - Laplace approximations for deep learning
  license: MIT
  license_file: LICENSE.txt
  homepage: https://github.com/AlexImmer/Laplace

extra:
  recipe-maintainers:
    - Tobias-Fischer
